name: payloads.json aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Neuestes Release lesen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_payloads.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- payloads.json; then
            echo "Keine neue Version."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add payloads.json
            git commit -m "payloads.json: $(python3 -c 'import json;print(json.load(open("payloads.json"))["payloads"][0]["version"])')"
            git push
          fi
