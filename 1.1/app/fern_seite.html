  for (;;) {

let listeHolt = false;

  if (listeHolt) return; listeHolt = true;

  catch (e) { } finally { listeHolt = false; }

      const { r, j } = await holenJ(mitK("/protokoll?ab=" + protAb), 10000); if (!r.ok || !j) break;

const FW = [400, 700, 600, 800];                                   /* Schrift 0 Inter, 1 fett, 2 halbfett, 3 extrafett */

/* Text an der Grundlinie y (wie text()); o.w = Breite (zu lang: "…"), o.a = "r" rechtsbündig bis x, "m" mittig um x */
function T(x, y, f, gr, farbe, t, o) {

  if (o.a === "r") { let b = breite(f, gr, t) * (1 + (o.ls || 0) * 0); if (o.w && b > o.w) b = o.w; st += "left:" + (x - b).toFixed(1) + "px;"; } else if (o.a === "m") st += "left:" + x + "px;transform:translateX(-50%);"; else st += "left:" + x + "px;";
  if (o.w) st += "max-width:" + Math.max(0, o.w) + "px;";

}
/* text_passend: erst kleiner (bis min), dann "…" */
function TP(x, y, f, gr, min, farbe, t, w, o) { let g = gr; while (g - 2 >= min && breite(f, g, t) > w) g -= 2; return T(x, y, f, g, farbe, t, Object.assign({ w }, o || {})); }
/* umbrochener Absatz: erste Grundlinie y, Zeilenabstand lh, höchstens max Zeilen */
function U(x, y, f, gr, farbe, t, w, lh, max, o) {
  o = o || {};
  let st = "left:" + x + "px;top:" + (y - lh / 2 - 0.3633 * gr).toFixed(1) + "px;width:" + w + "px;font-weight:" + FW[f] + ";font-size:" + gr + "px;line-height:" + lh + "px;color:" + farbe + ";";
  if (max) st += "max-height:" + (max * lh) + "px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:" + max + ";";
  if (o.a === "m") st += "text-align:center;";
  return '<div class="u" style="' + st + '">' + esc(t) + "</div>";
}
/* Zeilen zählen wie umbrechen(). NEU 1.1 (PS5-Test 16.11.2026: im Kasten liefen lange Namen wie "ps5upload-12.4.20.elf" oder Ordnerpfade in

function zeilenZahl(f, gr, t, w) {
