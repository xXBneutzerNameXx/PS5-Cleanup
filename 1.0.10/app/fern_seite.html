<title>PS5 Cleanup</title>
<!-- PS5 Cleanup 1.0.9 - Bedienung im Browser. Copyright (C) 2026 da_Chris86 - Lizenz: GPL-3.0-or-later.
     Steckt im Programm (app/fern.c), ohne fremde Skripte und ohne Daten im Browser. Die Seite holt den Zustand und die Liste von
     PS5 Cleanup und baut sich daraus selbst auf (Maus, Tastatur, Touch). Gelöscht wird nur auf der PS5, nach denselben Fragen wie am
     Fernseher: "Löschen" 1,5 s halten, bei der vollständigen Bereinigung LÖSCHEN eintippen.

<style>
:root{--hg:#121417;--karte:#1A1D22;--feld:#22262D;--rand:#262A31;--linie:#3A404A;--text:#F2F4F7;--text2:#D5DAE1;--grau:#B4BBC6;--grau2:#8B93A1;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--hg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
svg{flex:none}

.p-ver{background:var(--feld);color:var(--grau);letter-spacing:.02em}.p-gelb{background:rgba(227,190,106,.16);color:var(--gelb)}.p-blau{background:rgba(76,201,240,.14);color:var(--fokus)}.p-gruen{background:rgba(93,211,154,.14);color:var(--gruen)}

h1{font-size:34px;margin:0 0 6px;line-height:1.2}h2{font-size:22px;margin:0}
.kn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 24px;border-radius:14px;border:2px solid var(--linie);
 background:var(--feld);cursor:pointer;font-weight:700;font-size:18px;white-space:nowrap;transition:background .12s,border-color .12s}
.kn:hover{border-color:var(--grau2)}.kn:focus-visible,.chk:focus-visible,input:focus-visible,.ber:focus-visible,.zeile-k:focus-visible{outline:3px solid var(--fokus);outline-offset:3px}

.lw .d i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.schritte{display:flex;flex-direction:column;gap:26px;margin:22px 0 28px}
.schritt{display:flex;gap:20px;align-items:center}.schritt .nr{flex:none;width:48px;height:48px;border-radius:50%;background:var(--feld);display:grid;place-items:center;font-weight:750;font-size:18px;color:var(--grau)}
.schritt.an .nr{background:none;border:3px solid var(--fokus);color:var(--fokus)}.schritt b{display:block;font-size:22px}.schritt span{color:var(--grau);font-size:18px}
#s-wie{display:flex;flex-direction:column}#s-wie .kn{width:100%;margin-top:auto}
.chips{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}.chips .t{color:var(--grau);font-size:18px;margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:99px;background:var(--karte);border:1px solid var(--rand);font-size:18px;color:var(--text2)}
.gesamt{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--rand)}
.gesamt b{font-size:46px;font-weight:800;line-height:1}.gesamt span{color:var(--grau);font-size:19px}
.btab{width:100%;border-collapse:collapse}
.btab tr{cursor:pointer}.btab tr:hover td{background:rgba(255,255,255,.025)}
.btab td{padding:11px 4px;border-bottom:1px solid var(--rand);font-size:20px}.btab tr:last-child td{border-bottom:none}
.btab td.s{width:40px;color:var(--grau)}.btab td.n2{color:var(--grau);text-align:right;width:60px;font-size:18px}.btab td.g{text-align:right;font-weight:750;white-space:nowrap}
.btab tr.jb td:nth-child(2),.btab tr.jb td.s{color:var(--orange)}
.weiter{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}.weiter .t{flex:1;color:var(--grau);font-size:19px;min-width:240px}
/* Nachschauen / Löschen läuft */
.mitte{max-width:1500px;margin:2vh auto 0}

#liste{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(300px,440px);gap:22px;align-items:start}

#bereiche{padding:12px;display:flex;flex-direction:column;gap:4px}
.ber{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;border:2px solid transparent;cursor:pointer;width:100%}
.ber:hover{background:rgba(255,255,255,.03)}.ber.an{background:#1d2a3d;border-color:var(--fokus)}
.ber .tx{min-width:0;flex:1}.ber .n{font-weight:750;font-size:20px;display:block}.ber .u{font-size:16px;color:var(--grau);display:block;white-space:normal}   /* 1.0.9 (09.11.2026 20:12): "60 Einträge · 1,84 TB" bricht um statt die Größe abzuschneiden */
.ber .s{color:var(--grau)}.ber.jb .n,.ber.jb .s{color:var(--orange)}
.ber.aus{opacity:.45;cursor:default}.ber.aus:hover{background:none}

.summe{margin-top:8px;padding:14px;border-radius:12px;background:var(--hg);font-size:16px;color:var(--grau)}
.summe .z{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.summe .z b{color:var(--text);font-weight:700;white-space:nowrap}

#mitte{padding:20px 22px;min-width:0}
.mkopf{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.block{background:#20242a;border:2px solid transparent;border-radius:14px;margin-bottom:6px;overflow:hidden}

.bk{display:flex;align-items:center;gap:16px;padding:7px 16px;min-height:64px}

.auf{width:38px;height:38px;border-radius:10px;border:none;background:none;cursor:pointer;color:var(--grau);display:grid;place-items:center;flex:none}

.hinweise{margin-top:16px}.hinweise div{display:flex;gap:12px;align-items:flex-start;margin-top:8px;font-size:17px;color:var(--grau)}.hinweise div.c-y{color:var(--gelb)}.hinweise div.c-r{color:var(--rot)}
.bleibt{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;margin-top:18px;padding:14px 22px;border-radius:14px;background:var(--karte);border:1px solid var(--rand);font-size:17px;color:var(--grau)}
.bleibt b{color:var(--text)}.bleibt span{display:inline-flex;gap:8px;align-items:center}.bleibt .jbb{margin-left:auto;color:var(--orange)}
.halten{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-width:320px;min-height:80px!important;justify-content:flex-start!important;text-align:left}
.halten::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(255,255,255,.16);transform-origin:left;transform:scaleX(var(--p,0))}
.halten .ring{position:relative;width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(#fff calc(var(--p,0)*360deg),rgba(255,255,255,.28) 0);display:grid;place-items:center}
.halten .ring::after{content:"✕";width:40px;height:40px;border-radius:50%;background:var(--rotk);display:grid;place-items:center;font-size:22px}
.halten .tx2{position:relative;display:flex;flex-direction:column;line-height:1.25}.halten .tx2 small{font-weight:500;font-size:16px;opacity:.9}
.unter-k{text-align:center;color:var(--grau);font-size:17px;margin-top:12px}
.eingabe{width:100%;height:60px;border-radius:14px;border:2px solid var(--linie);background:var(--hg);color:var(--gelb);font-family:inherit;font-weight:750;font-size:24px;padding:0 18px;margin-top:14px;letter-spacing:.06em;text-transform:uppercase}
.eingabe.frei{text-transform:none;color:var(--text);font-weight:500}
.fertig-kreis{width:104px;height:104px;border-radius:50%;margin:10px auto 18px;display:grid;place-items:center}.fertig-kreis.ok{background:#173525;color:var(--gruen)}.fertig-kreis.nok{background:rgba(227,190,106,.14);color:var(--gelb)}
.fertig-gross{font-size:62px;font-weight:800;text-align:center;margin:0 0 6px;line-height:1.1}
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:26px}
.drei .karte .l{display:flex;align-items:center;gap:16px;color:var(--grau);font-size:18px;margin-bottom:14px}.drei .karte .sym{width:52px;height:52px}
.drei .karte .w{font-size:19px;line-height:1.55}
/* Protokoll, Optionen, Meldungen */
#prot{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);z-index:48;background:var(--karte);border-left:1px solid var(--rand);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .2s}
#prot.sichtbar{transform:none}
#prot .kopf2{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rand)}
#prot pre{flex:1;margin:0;overflow:auto;padding:14px 20px;font:14px/1.55 ui-monospace,Consolas,monospace;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere}
#menue{position:fixed;top:0;right:0;bottom:0;left:0;z-index:47;background:rgba(8,9,11,.66);display:flex;align-items:center;justify-content:center;padding:16px}
#menue .karte{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px}
#menue h2{font-size:26px;margin:0 0 16px}
#menue button.op{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:14px 18px;border:2px solid transparent;border-radius:14px;background:var(--feld);cursor:pointer;margin-top:10px}
#menue button.op:hover,#menue button.op:focus-visible{border-color:var(--fokus);outline:none}#menue button.op:disabled{opacity:.4;cursor:default;border-color:transparent}
#menue .op b{display:block;font-size:20px}#menue .op span.u{display:block;color:var(--grau);font-size:17px}#menue .op svg{color:var(--grau)}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:50;max-width:min(1100px,calc(100% - 32px));background:#2a2618;color:var(--gelb);
 border:1px solid rgba(227,190,106,.35);border-radius:14px;padding:12px 22px;font-weight:700;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#toast.da{opacity:1}
#netz{position:fixed;left:0;right:0;top:0;z-index:60;background:#3a1f1e;color:#ffd1cf;text-align:center;padding:8px 12px;font-weight:600}
/* großer Bildschirm: die Liste füllt die Höhe, jede Spalte rollt für sich (wie am Fernseher) */
@media (min-width:1181px) and (min-height:640px){
 body.s-voll #haupt{display:flex;flex-direction:column}
 body.s-voll .zwei-sp{flex:1}
 body.s-voll .zwei-sp>.karte{display:flex;flex-direction:column}
 /* 1.0.9 (PS5-Test 09.11.2026 17:04/17:22, da_Chris86: zu viel Leerraum - aber auch nicht alles oben, die Mitte): die Karten füllen die Höhe,
  * Laufwerke und Schritte stehen mit maßvollem Abstand (wächst mit der Höhe, höchstens 56 px) in der Mitte der Karte, die Zeilen der
  * Bereiche werden etwas höher */
 body.s-voll .lw-l{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(26px,4vh,56px);margin:12px 0}
 body.s-voll .lw-l .lw{margin-top:0}
 body.s-voll .schritte{flex:1;justify-content:center;gap:clamp(26px,4vh,56px);margin:12px 0 22px}
 body.s-voll .btab td{padding-top:clamp(11px,1.5vh,20px);padding-bottom:clamp(11px,1.5vh,20px)}
 body.s-voll #u-bt>.btab{margin:auto 0}   /* 1.0.9 (PS5-Test 09.11.2026 18:03): die Liste der Bereiche wie links die Laufwerke in die Mitte der Karte */
 body.l-voll{height:100vh;height:100dvh;overflow:hidden}
 body.l-voll #haupt{display:flex;flex-direction:column;padding-bottom:14px}
 body.l-voll #liste{flex:1;min-height:0;align-items:stretch}
 body.l-voll #bereiche,body.l-voll #mitte,body.l-voll #infofeld .karte{height:100%;overflow:auto}
 body.l-voll #infofeld{min-height:0}
}
/* 1.0.9 (Rundgang 09.11.2026 20:30 bei 1440 px): drei Spalten, aber die mittlere bekommt genug Platz für Name, Schild und Größe */
@media (min-width:1181px) and (max-width:1599px){#liste{grid-template-columns:minmax(240px,290px) minmax(0,1fr) minmax(280px,320px)}}
@media (min-width:1181px) and (max-width:1399px){#liste{grid-template-columns:minmax(220px,240px) minmax(0,1fr) minmax(240px,260px)}.bk{gap:10px}}
@media (max-width:1180px){#liste{grid-template-columns:270px minmax(0,1fr)}#infofeld{display:none}#infofeld.blatt{display:block}
 #infofeld.blatt{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;padding:0}
 #infofeld.blatt .karte{border-radius:20px 20px 0 0;max-height:72vh;overflow:auto;padding-bottom:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}

 #hintergrund{position:fixed;top:0;right:0;bottom:0;left:0;z-index:44;background:rgba(0,0,0,.5)}
 .zwei-sp{grid-template-columns:minmax(0,1fr)}
 .sr .wort{display:none}.sr.an .wort{display:inline}.sv{width:18px}
}
@media (max-width:900px){
 .raster3,.drei{grid-template-columns:minmax(0,1fr)}

 .marke img{width:44px;height:44px;border-radius:11px}.z1 .name{font-size:22px}#satz{font-size:15px}
}
@media (max-width:760px){
 html,body{font-size:15px}
 #liste{grid-template-columns:minmax(0,1fr);gap:12px}
 #bereiche{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;scrollbar-width:none}#bereiche::-webkit-scrollbar{display:none}
 .ber{width:auto;flex:none;padding:8px 12px}.ber .u{display:none}.ber .n{font-size:16px}.ber .s{display:none}.ber-trenn,.summe{display:none}
 #mitte{padding:0;background:none;border:none}.mkopf h2{font-size:22px}
 .bk .g{min-width:0}.auf{width:28px}.bk .u{font-size:14px}.tl{padding:6px 8px}.tl .n{font-size:16px;white-space:normal}.tl .g{font-size:15px;min-width:0}

 h1{font-size:26px}.ftitel .sym{width:46px;height:46px}
 #leiste{position:sticky;bottom:var(--fh);z-index:15;padding:0 0 0}#leiste .innen{border-radius:0;border-left:none;border-right:none;padding:10px 12px}
 #leiste .innen{gap:8px}#leiste .txt{flex-basis:100%;min-width:0}#leiste .t1{font-size:16px}#leiste .t2{font-size:13px;line-height:1.3}
 #leiste .kn{flex:1 1 0;min-width:0;min-height:44px;font-size:14px;padding:0 8px;gap:6px;white-space:normal;line-height:1.15;border-radius:11px}#leiste .kn svg{width:18px;height:18px}
 .halten{min-width:0;width:100%}.knoepfe{flex-direction:column}.knoepfe .kn{flex:1;white-space:normal;width:100%}
 /* Handy: der Knopf gleich nach den Karten oben, nicht erst nach dem Speicher */
 body.s-voll #haupt{display:flex;flex-direction:column}body.s-voll .zwei-sp{display:contents}
 #s-k,#u-k{order:1;margin-bottom:14px}#s-wie{order:2;margin-bottom:14px}#u-bt{order:2;margin-bottom:6px}.weiter{order:3;margin:0 0 14px}#s-sp,#u-sp{order:4}#s-ch{order:5}

 #modal{padding:6px 14px 24px}

 #kopf{padding-top:28px;padding-bottom:18px}.marke img{width:70px;height:70px;border-radius:17px}.z1 .name{font-size:35px}.pille{font-size:15px;padding:5px 14px}
 .sr{gap:12px}.sr .kr{width:46px;height:46px;font-size:19px}.sr .kr svg{width:22px;height:22px}.sv{width:46px}
 /* 1.0.9 (Rundgang 09.11.2026 18:10 bei 2560 x 1300): kleine Knöpfe, Protokoll und Mitlese-Fenster größer; Fragetext und Gruppen beim

 .kn.klein{font-size:17px;min-height:44px}.prot-live{font-size:16px}#prot{width:min(1000px,100%)}#prot pre{font-size:16px}
 .frage-t{max-height:calc(100vh - 520px)}.gruppe ul{max-height:42vh}

 .gesamt span{font-size:20px}.btab td{font-size:22px}.btab td.n2{font-size:19px}.weiter .t{font-size:23px}
 .lz{font-size:19px}.lz .st{font-size:17px}
 .gruppe .gk b{font-size:24px}.gruppe .gk span{font-size:18px}.gruppe li{font-size:19px}
 .hinweise div{font-size:18px}.bleibt{font-size:18px}.unter-k{font-size:18px}.frage-t{font-size:20px}
 .drei .karte .l{font-size:19px}.drei .karte .w{font-size:20px}
 #menue .op b{font-size:21px}#menue .op span.u{font-size:18px}

 .btab td.s{width:48px}.btab td.s svg,.ber .s svg{width:30px;height:30px}.lw .k svg{width:32px;height:32px}.chip svg{width:26px;height:26px}

<script>
"use strict";
/* ---------------------------------------------------------------- Grundlagen */
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let ST = null, V = 0, LISTE = null, EN = false;
const SCHL = (document.querySelector('meta[name="k"]') || {}).content || "";   /* setzt PS5 Cleanup beim Ausliefern ein (gegen fremde Webseiten) */
const mitK = u => u + (u.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(SCHL);
let neuLaden = 0;
function abgewiesen(r) {   /* 403: PS5 Cleanup wurde neu gestartet (neuer Schlüssel) - die Seite neu laden */
  if (r.status !== 403) return false;
  if (!neuLaden) neuLaden = setTimeout(() => location.reload(), 1500);
  return true;
}
const L = (de, en) => EN ? en : de;
const warte = ms => new Promise(r => setTimeout(r, ms));
async function holen(url, ms, opt) {
  const ab = new AbortController(), t = setTimeout(() => ab.abort(), ms);
  try { return await fetch(url, Object.assign({ cache: "no-store", signal: ab.signal }, opt || {})); } finally { clearTimeout(t); }
}
async function holenJ(url, ms) {   /* GET mit JSON: die Zeitgrenze gilt bis der ganze Inhalt da ist (Codex-Prüfung 144) */
  const ab = new AbortController(), t = setTimeout(() => ab.abort(), ms);
  try { const r = await fetch(url, { cache: "no-store", signal: ab.signal }); return { r, j: r.status === 200 ? await r.json() : null }; } finally { clearTimeout(t); }
}
async function befehl(o) {   /* geht an PS5 Cleanup - dort mit denselben Prüfungen wie am Fernseher; true = angekommen */
  try {
    const r = await holen(mitK("/befehl"), 8000, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
    if (abgewiesen(r)) return false;
    if (r.ok) return true;
    meldung(L("Nicht angekommen - bitte noch einmal.", "Did not arrive - please try again."));
  } catch (e) { meldung(L("Keine Verbindung zu PS5 Cleanup.", "No connection to PS5 Cleanup.")); }
  return false;
}
let toastZeit = 0;
function meldung(t, ms) { const e = $("#toast"); e.textContent = t; e.classList.add("da"); clearTimeout(toastZeit); toastZeit = setTimeout(() => e.classList.remove("da"), ms || 4000); }

function menueZu() { const m = $("#menue"); if (m.classList.contains("leer")) return; m.classList.add("leer"); const b = $("#b-menue"); if (b && $("#modal").classList.contains("leer")) b.focus(); }
